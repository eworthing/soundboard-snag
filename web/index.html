<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Soundboard Snag</title>
  <!-- The app loads this page with ?app=1: its window has a translucent material behind the page. -->
  <script>
    if (location.search.indexOf('app=1') !== -1) document.documentElement.classList.add('in-app');
    try { var size = parseInt(localStorage.getItem('soundboard-snag.size'), 10); if (size) document.documentElement.style.fontSize = size + 'px'; } catch (e) {}
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="toolbar">
    <form class="toolbar__search" id="search-form" role="search" novalidate>
      <label for="search-input" class="sr-only">Search soundboards</label>
      <input
        type="search"
        id="search-input"
        class="field field--search"
        placeholder="Search soundboards"
        autocomplete="off"
        spellcheck="false"
        aria-required="true"
        autofocus
      >
      <button type="submit" class="btn btn--primary" id="search-btn">
        <span class="grab-label">Search</span>
        <svg class="grab-spinner" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="2.5" fill="none" stroke-dasharray="22" stroke-dashoffset="8"/>
        </svg>
      </button>
    </form>

    <div class="toolbar__filters" role="group" aria-label="Search filters">
      <label class="filter">Minimum views
        <input type="number" id="min-views" class="field field--number" value="10" min="0" step="1">
      </label>
      <label class="filter">Minimum sounds
        <input type="number" id="min-sounds" class="field field--number" value="3" min="0" step="1">
      </label>
      <label class="filter">Results
        <input type="number" id="max-results" class="field field--number" value="20" min="1" max="200" step="1">
      </label>
      <label class="filter">Sort by
        <select id="sort-order" class="field field--popup">
          <option value="views">Most viewed</option>
          <option value="recent">Recently updated</option>
        </select>
      </label>
      <label class="filter filter--check">
        <input type="checkbox" id="include-dates"> Show update dates
      </label>
    </div>
  </header>

  <main class="content">
    <section class="rack" id="rack" aria-label="Search results">
      <div class="rack__header">
        <span class="rack__count" id="rack-count" aria-live="polite" aria-atomic="true"></span>
        <span class="rack__status" id="rack-status" aria-live="polite" aria-atomic="true"></span>
      </div>

      <div class="pad-grid" id="pad-grid" role="list" aria-label="Soundboard results"></div>

      <div class="rack__empty" id="rack-empty">
        <p>Search for a soundboard to get started.</p>
      </div>
    </section>
  </main>

  <div class="toast-container" id="toast-container" role="status" aria-live="polite" aria-atomic="false"></div>

  <script src="app.js"></script>
</body>
</html>
